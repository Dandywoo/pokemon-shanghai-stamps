name: Build Xiaohongshu preview package
on:
  push:
    branches: [xiaohongshu]
    paths:
      - 'xhs/**'
      - '.github/workflows/xhs-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and validate offline package
        run: |
          npm install --no-save --ignore-scripts esbuild@0.25.12 acorn@8.15.0
          mkdir -p dist-xhs
          cp xhs/index.html dist-xhs/index.html
          node -e "require('esbuild').buildSync({entryPoints:['xhs/app.source.js'],outfile:'dist-xhs/app.js',target:['es2017','chrome61'],format:'iife',bundle:false,legalComments:'none'})"
          node -e "const fs=require('fs');const h=fs.readFileSync('dist-xhs/index.html','utf8'),j=fs.readFileSync('dist-xhs/app.js','utf8');require('acorn').parse(j,{ecmaVersion:2017});if(h.includes('<script>')||h.includes('onclick=')||h.includes('_blank')||['navigator.clipboard','localStorage','document.execCommand','raw.githubusercontent.com'].some(x=>j.includes(x)))throw Error('Forbidden capability'); console.log('ES2017 and offline checks passed')"
          cd dist-xhs && zip -q ../shanghai-dex-xhs-preview.zip index.html app.js
          cd .. && unzip -t shanghai-dex-xhs-preview.zip
      - uses: actions/upload-artifact@v4
        with:
          name: shanghai-dex-xhs-preview
          path: shanghai-dex-xhs-preview.zip
          retention-days: 30
