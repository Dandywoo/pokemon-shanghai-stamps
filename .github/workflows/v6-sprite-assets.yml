name: Retrieve V6 matching pixel sprites
on:
  push:
    branches: [v6-sprite-assets]
    paths: ['.github/workflows/v6-sprite-assets.yml']
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original Gen 5 pixel sprites
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          import io, json, re, base64, urllib.request, concurrent.futures, pathlib
          from PIL import Image, ImageOps
          src=pathlib.Path('xhs/app.source.js').read_text()
          art=json.loads(re.search(r'const LOCAL_ART\s*=\s*(\{.*?\});',src,re.S).group(1))
          names={1:'bulbasaur',4:'charmander',7:'squirtle',25:'pikachu',52:'meowth',60:'poliwag',61:'poliwhirl',90:'shellder',132:'ditto',144:'articuno',145:'zapdos',146:'moltres',149:'dragonite',158:'totodile',225:'delibird',234:'stantler',235:'smeargle',319:'sharpedo',363:'spheal',438:'bonsly',730:'primarina',840:'applin',845:'cramorant',869:'alcremie',872:'snom',924:'tandemaus',957:'tinkatink',958:'tinkatuff',959:'tinkaton',976:'veluza'}
          p=pathlib.Path('color'); p.mkdir()
          def fetch(url):
              return urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=20).read()
          def go(item):
              n,name=item
              old=Image.open(io.BytesIO(base64.b64decode(art[str(n)].split(',')[1]))).convert('RGBA')
              for url in [f'https://play.pokemonshowdown.com/sprites/gen5/{name}.png',f'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/{n}.png']:
                  try:
                      im=Image.open(io.BytesIO(fetch(url))).convert('RGBA')
                      if im.size!=old.size or im.getchannel('A').tobytes()!=old.getchannel('A').tobytes(): continue
                      if not any(r!=g or g!=b for r,g,b,a in im.getdata() if a): continue
                      im.save(p/f'{n}.png')
                      print(n,name,'matching shape',flush=True)
                      return
                  except Exception as e: print(n,str(e),flush=True)
              print(n,name,'NO MATCH',flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as e: list(e.map(go,names.items()))
          print('Matched',len(list(p.glob('*.png'))),'of 30')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v6-colored-pixel-assets
          path: color/
          retention-days: 7
