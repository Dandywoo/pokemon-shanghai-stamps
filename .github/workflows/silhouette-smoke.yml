name: Silhouette browser smoke test
on:
  push:
    branches: [main]
    paths: ['silhouette/index.html', '.github/workflows/silhouette-smoke.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real browser collection and poster download
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          python3 -m http.server 8765 > /tmp/silhouette-http.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,acceptDownloads:true});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.addInitScript(()=>{Object.defineProperty(navigator,'canShare',{configurable:true,value:d=>!!(d.files&&d.files[0]&&d.files[0].type==='image/png')});Object.defineProperty(navigator,'share',{configurable:true,value:d=>{window.__sharedFile={name:d.files[0].name,type:d.files[0].type,size:d.files[0].size};return Promise.resolve()}})});
            await page.clock.setFixedTime(new Date('2026-11-25T05:00:00Z'));
            await page.goto('http://127.0.0.1:8765/silhouette/');
            await page.locator('#tabList').waitFor({state:'visible'});
            await page.waitForFunction(()=>!document.querySelector('#tabList').disabled);
            assert.equal(await page.locator('#home [data-open-series]').count(),0);
            assert.equal(await page.locator('#home > section').first().getAttribute('id'),'homeNotices');
            assert.match(await page.locator('#homeReminder').innerText(),/今日开启/);
            assert.match(await page.locator('#homeDashboard').innerText(),/首日集章预览/);
            assert.equal(await page.locator('#homeReminder a[data-official]').count(),3);
            await page.clock.setFixedTime(new Date('2026-12-12T03:00:00Z'));
            await page.locator('#tabHome').click();
            assert.equal(await page.locator('#home > section').first().getAttribute('id'),'homeDashboard');
            assert.match(await page.locator('#homeDashboard').innerText(),/今日集章/);
            await page.locator('[data-dashboard-plan]').click();
            assert.equal(await page.locator('#date').inputValue(),'2026-12-12');
            await page.locator('#tabHome').click();
            await page.clock.setFixedTime(new Date('2026-11-25T05:00:00Z'));
            await page.locator('#tabHome').click();
            const fs=require('node:fs');fs.mkdirSync('visual-check',{recursive:true});
            await page.screenshot({path:'visual-check/home.png'});
            await page.locator('#tabMap').click();
            await page.locator('#mapDate').fill('2026-12-12');
            await page.locator('#mapKind').selectOption('walk');
            const pinNumbers=await page.locator('#exploreMap .map-pin-number').allTextContents();
            assert.equal(new Set(pinNumbers).size,pinNumbers.length);
            assert.ok(pinNumbers.length>10);
            assert.deepEqual(pinNumbers,await page.locator('#exploreList .map-site-number').allTextContents());
            await page.locator('#exploreMap [data-explore="5"]').click();
            assert.match(await page.locator('#exploreDetail h3').innerText(),/06.*环球港/);
            assert.equal(await page.locator('#exploreList [data-explore="5"]').getAttribute('aria-pressed'),'true');
            await page.locator('#mapRegion').selectOption({label:'长宁区'});
            assert.ok((await page.locator('#exploreMap .map-pin-number').allTextContents()).every(n=>pinNumbers.includes(n)));
            await page.locator('#mapRegion').selectOption('');
            await page.screenshot({path:'visual-check/map.png'});
            await page.locator('#tabList').click();
            assert.equal(await page.locator('#pocketGrid .dex-tile').count(),30);
            assert.equal(await page.locator('#pocketGrid .dex-art img').count(),30);
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth),true);
            assert.equal(await page.locator('#pocketGrid .dex-tile').first().evaluate(e=>e.getBoundingClientRect().top<600),true);
            await page.screenshot({path:'visual-check/dex.png'});
            await page.locator('#list [data-open-series]').click();
            await page.waitForFunction(()=>document.querySelector('#seriesPanel').open);
            assert.equal(await page.locator('#seriesGrid .series-row').count(),6);
            assert.equal(await page.locator('#seriesTabs button').count(),3);
            assert.equal(await page.locator('#dexSeriesCount').innerText(),'0/21');
            assert.equal(await page.locator('#pocketGrid').evaluate(e=>!!(e.compareDocumentPosition(document.querySelector('#seriesPanel'))&Node.DOCUMENT_POSITION_FOLLOWING)),true);
            assert.equal(await page.locator('#seriesTabs').innerText().then(t=>t.includes('属性研究')),false);
            await page.locator('[data-pocket="s1-2"]').click();
            await page.locator('[data-pocket="s2-2"]').click();
            await page.locator('[data-pocket="s3-2"]').click();
            assert.equal(await page.locator('#seriesGrid .series-earned').count(),1);
            assert.match(await page.locator('#seriesGrid .series-earned').innerText(),/三圣鸟/);
            assert.match(await page.locator('#collectToast .achievement-unlocked').innerText(),/三圣鸟/);
            await page.screenshot({path:'visual-check/unlock.png'});
            await page.locator('[data-pocket="s3-2"]').click();
            await page.locator('[data-pocket="s3-2"]').click();
            assert.equal(await page.locator('#collectToast .achievement-unlocked').count(),0);
            await page.locator('#list [data-open-poster]').click();
            await page.locator('#posterImage').waitFor({state:'visible',timeout:15000});
            await page.waitForFunction(()=>document.querySelector('#posterImage').naturalWidth===1080);
            assert.equal(await page.locator('#posterImage').evaluate(e=>e.naturalHeight),1440);
            assert.match(await page.locator('#posterDownload').getAttribute('href'),/^blob:/);
            assert.equal(await page.locator('#posterImage').getAttribute('src'),await page.locator('#posterDownload').getAttribute('href'));
            assert.equal(await page.locator('#posterImage').evaluate(e=>getComputedStyle(e).webkitTouchCallout||'default'),'default');
            assert.equal(await page.locator('#shareOverlay .poster-footer a:visible, #shareOverlay .poster-footer button:visible').count(),1);
            assert.equal(await page.locator('#posterImage').evaluate(e=>{let im=e.getBoundingClientRect(),p=document.querySelector('#posterPreview').getBoundingClientRect(),h=document.querySelector('.poster-header').getBoundingClientRect(),f=document.querySelector('.poster-footer').getBoundingClientRect();return im.top>=h.bottom-1&&im.bottom<=f.top+1&&im.height<=p.height}),true);
            await page.screenshot({path:'visual-check/poster-modal.png'});
            await page.locator('#posterDownload').click();
            assert.equal(await page.evaluate(()=>window.__sharedFile.name),'shanghai-collection.png');
            assert.equal(await page.evaluate(()=>window.__sharedFile.type),'image/png');
            assert.ok(await page.evaluate(()=>window.__sharedFile.size)>10000);
            await page.evaluate(()=>Object.defineProperty(navigator,'canShare',{configurable:true,value:()=>false}));
            await page.locator('#closeShare').click();
            await page.locator('#list [data-open-poster]').click();
            await page.locator('#posterDownload').waitFor({state:'visible'});
            const downloadPromise=page.waitForEvent('download');
            await page.locator('#posterDownload').click();
            const d=await downloadPromise;assert.equal(d.suggestedFilename(),'shanghai-collection.png');
            assert.equal(await d.failure(),null);
            await d.saveAs('visual-check/poster.png');
            const imageBytes=await page.evaluate(async()=>{const r=await fetch(document.getElementById('posterDownload').href);return Array.from(new Uint8Array(await r.arrayBuffer()).slice(0,8))});
            assert.deepEqual(imageBytes,[137,80,78,71,13,10,26,10]);
            await page.locator('#closeShare').click();
            assert.equal(await page.locator('#shareOverlay').isHidden(),true);
            assert.equal(await page.evaluate(()=>document.body.classList.contains('poster-opened')),false);
            await page.reload();
            await page.waitForFunction(()=>!document.querySelector('#tabList').disabled);
            await page.locator('#tabList').click();
            await page.locator('#list [data-open-series]').click();
            assert.match(await page.locator('#seriesGrid .series-earned').innerText(),/三圣鸟/);
            await page.evaluate(()=>Object.defineProperty(navigator,'canShare',{configurable:true,value:()=>false}));
            await page.locator('#list [data-open-poster]').click();
            await page.locator('#posterImage').waitFor({state:'visible'});
            assert.equal(await page.locator('#shareOverlay .poster-footer a:visible, #shareOverlay .poster-footer button:visible').count(),1);
            assert.match(await page.locator('#posterHint').innerText(),/长按/);
            assert.deepEqual(errors,[]);
            console.log('PASS: one-button poster, full image preview, native file share mock, real PNG download, reload persistence');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silhouette-v4-visual-check
          path: visual-check/
          retention-days: 7
