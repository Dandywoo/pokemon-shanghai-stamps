name: Preview browser smoke test
on:
  push:
    branches: [main]
    paths: ['index.html','ui-preview.html','.github/workflows/preview-smoke.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate preview in Chrome
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          python3 -m http.server 8765 >/tmp/preview-http.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
            page.on('pageerror',e=>console.log('PAGEERROR',e.stack));
            page.on('console',m=>console.log('BROWSER',m.type(),m.text()));
            let html=fs.readFileSync('index.html','utf8');
            await page.route('**/index.html*',r=>r.fulfill({contentType:'text/html; charset=utf-8',body:html.replace('})().catch(function() {','})().catch(function(error) {console.error(error.stack||error);')}));
            await page.addInitScript(()=>Object.defineProperty(navigator,'geolocation',{configurable:true,value:{getCurrentPosition:ok=>ok({coords:{latitude:31.220,longitude:121.420,accuracy:20}})}}));
            await page.goto('http://127.0.0.1:8765/index.html');
            await page.waitForFunction(()=>window.__dexVersion==='7.2.2'&&document.querySelector('#startupGate')?.hidden,{timeout:15000}).catch(async e=>{console.log('BODY',await page.locator('body').innerText().then(t=>t.slice(0,1000)));throw e});
            assert.equal(await page.locator('#home').isVisible(),true);
            assert.equal(await page.locator('#home > section').first().getAttribute('aria-label'),'集章进度与奖励');
            assert.equal(await page.locator('#home .home-shortcuts').isVisible(),false);
            assert.equal(await page.locator('#home [data-task="all"]').isVisible(),true);
            assert.ok(await page.locator('#homeReminder > .home-notice-row:visible').count()<=2);
            const more=page.locator('#homeReminder .home-notice-more');if(await more.count()){await more.locator('summary').click();assert.equal(await more.evaluate(e=>e.open),true);await more.locator('summary').click();}
            await page.locator('#homeDashboard .home-day-details summary').click();assert.equal(await page.locator('#homeDashboard .home-day-details').evaluate(e=>e.open),true);
            await page.locator('#homeDashboard .home-day-details summary').click();
            assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth));
            console.log('HOME',await page.locator('#home').innerText());
            await page.locator('#tabMap').click();
            await page.locator('#v6MapOrigin').evaluate(e=>e.closest('details').open=true);
            await page.locator('#v6MapGPS').click();
            await page.waitForFunction(()=>document.querySelector('#originSource').value==='gps',{timeout:15000});
            const checkLayout=async()=>{const b=await page.locator('#v6MapGPS').boundingBox(),m=await page.locator('#gpsMapManual').boundingBox(),s=await page.locator('#gpsMapOrigin').boundingBox();assert.ok(b&&m&&s);assert.ok(Math.abs(b.y-m.y)<2&&Math.abs(b.height-m.height)<2&&b.height<=46);assert.ok(s.y>=b.y+b.height&&s.width>b.width*1.8);assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth));console.log('LAYOUT',JSON.stringify({b,m,s}));};
            await checkLayout();
            assert.equal(await page.locator('#v6MapOrigin').isVisible(),false);
            const choices=await page.locator('#gpsMapOrigin option').allTextContents();assert.ok(choices.length>=2);console.log('CANDIDATES',choices);
            await page.locator('#gpsMapOrigin').selectOption({index:1});assert.equal(await page.locator('#gpsPlanOrigin').inputValue(),await page.locator('#gpsMapOrigin').inputValue());assert.equal(await page.locator('#originSource').inputValue(),'gps');
            await page.locator('#gpsMapManual').click();assert.equal(await page.locator('#originSource').inputValue(),'manual');assert.equal(await page.locator('#gpsMapOrigin').isVisible(),false);assert.equal(await page.locator('#v6MapOrigin').isVisible(),true);
            await page.locator('#v6MapGPS').click();await page.waitForFunction(()=>document.querySelector('#originSource').value==='gps');await checkLayout();
            await page.locator('#v6MapCompute').click();
            await page.waitForFunction(()=>!document.querySelector('#v6MapCompute').disabled);
            console.log('RESULT',await page.locator('#v6MapResult').innerText());
            assert.match(await page.locator('#v6MapResult').innerText(),/预计新增/);
            await page.locator('#tabList').click();
            await page.locator('[data-pocket]').first().click();
            assert.ok(await page.evaluate(()=>JSON.parse(localStorage.getItem('sh-pokemon-stamps-v1')).done.length>0));
            await page.reload();
            await page.waitForFunction(()=>window.__dexVersion==='7.2.2'&&document.querySelector('#startupGate')?.hidden);
            assert.ok(await page.evaluate(()=>JSON.parse(localStorage.getItem('sh-pokemon-stamps-v1')).done.length>0));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
